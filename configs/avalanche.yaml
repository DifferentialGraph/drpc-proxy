avaxgo-archive:
  - id: ${ID}
    chain: avalanche
    labels:
      provider: ${PROVIDER}
      extra_gas_limit: 600000000
      archive: true
    method-groups:
      enabled:
        - debug
        - filter
    methods:
      enabled:
        - name: txpool_content
    connection:
      generic:
        rpc:
          url: ${RPC}
        ws:
          frameSize: 20Mb
          msgSize: 50Mb
          url: ${WS}
